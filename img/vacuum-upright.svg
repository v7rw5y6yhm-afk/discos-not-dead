<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="vusky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ddc0"/>
      <stop offset=".6" stop-color="#d9c9a4"/>
      <stop offset="1" stop-color="#c2ae83"/>
    </linearGradient>
    <radialGradient id="vusun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3cf" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff3cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vuvig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a4132" stop-opacity=".4"/>
    </radialGradient>
    <filter id="vugrain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- dawn, but beige -->
  <rect width="800" height="600" fill="url(#vusky)"/>
  <circle cx="400" cy="360" r="150" fill="url(#vusun)"/>
  <circle cx="400" cy="360" r="70" fill="#f7edd2"/>
  <!-- horizon: a very flat, very tidy field -->
  <rect y="380" width="800" height="220" fill="#a3966f"/>
  <g stroke="#8a7c5c" stroke-width="3" opacity=".6">
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="0" y1="530" x2="800" y2="530"/>
  </g>

  <!-- the upright, chrome and maroon, standing perfectly still, headlight already on -->
  <g transform="translate(340,180)">
    <ellipse cx="60" cy="215" rx="80" ry="18" fill="#4a4132" opacity=".35"/>
    <rect x="66" y="-6" width="8" height="150" rx="4" fill="#9aa0a7" transform="rotate(8 70 69)"/>
    <rect x="72" y="-14" width="18" height="10" rx="5" fill="#2b2b2e" transform="rotate(8 81 -9)"/>
    <path d="M24 26 c0 -9 30 -9 30 0 l7 102 c1 12 -44 12 -44 0 Z" fill="#6e2029" stroke="#3c1016" stroke-width="3"/>
    <path d="M8 202 c0 -15 15 -23 35 -23 s35 8 35 23 l0 5 c0 5 -70 5 -70 0 Z" fill="#b9bec4" stroke="#6d737a" stroke-width="2"/>
    <rect x="4" y="205" width="78" height="9" rx="4.5" fill="#4a4e53"/>
    <!-- the headlight, doing what headlights do to a sunrise: competing -->
    <circle cx="43" cy="192" r="10" fill="#fff3cf" stroke="#6d737a" stroke-width="2.4"/>
    <path d="M53 186 L145 166 L145 214 L53 198 Z" fill="#fff3cf" opacity=".35"/>
  </g>

  <!-- one bird, keeping its distance -->
  <path d="M600 130 q10 -10 20 0 q10 -10 20 0" fill="none" stroke="#6b5d43" stroke-width="4" stroke-linecap="round"/>

  <!-- caption plate -->
  <rect x="292" y="548" width="216" height="30" rx="4" fill="#f4eeda" stroke="#8a7c5c" stroke-width="2"/>
  <text x="400" y="568" text-anchor="middle" font-family="monospace" font-size="13" fill="#4a4132">"THE UPRIGHT AT DAWN"</text>

  <rect width="800" height="600" fill="url(#vuvig)"/>
  <rect width="800" height="600" filter="url(#vugrain)"/>
</svg>
