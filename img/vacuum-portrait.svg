<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="vpwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8d5"/>
      <stop offset="1" stop-color="#d5c9ac"/>
    </linearGradient>
    <radialGradient id="vpspot" cx=".5" cy=".38" r=".55">
      <stop offset="0" stop-color="#fff8dd" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff8dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vpvig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a4132" stop-opacity=".4"/>
    </radialGradient>
    <filter id="vpgrain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#vpwall)"/>
  <!-- beige curtain, formal occasion -->
  <g fill="#c9b98a">
    <path d="M0 0 h120 c-20 150, 20 450, -10 600 h-110 Z"/>
    <path d="M800 0 h-120 c20 150, -20 450, 10 600 h110 Z"/>
  </g>
  <g fill="#b8a789" opacity=".6">
    <path d="M40 0 c10 200, -14 420, 6 600 h18 c-16 -180, 8 -400, -4 -600 Z"/>
    <path d="M745 0 c-10 200, 14 420, -6 600 h-18 c16 -180, -8 -400, 4 -600 Z"/>
  </g>
  <circle cx="400" cy="230" r="290" fill="url(#vpspot)"/>

  <!-- pedestal -->
  <rect x="270" y="440" width="260" height="26" rx="6" fill="#8a7c5c"/>
  <rect x="292" y="466" width="216" height="70" rx="8" fill="#a3966f"/>

  <!-- the subject: a canister vacuum, posed at three-quarter angle -->
  <g transform="translate(320,220)">
    <ellipse cx="80" cy="200" rx="96" ry="34" fill="#8a7c5c" opacity=".5"/>
    <ellipse cx="80" cy="170" rx="90" ry="56" fill="#a89670"/>
    <ellipse cx="80" cy="152" rx="90" ry="50" fill="#c2b088"/>
    <ellipse cx="80" cy="140" rx="62" ry="30" fill="#d4c49c"/>
    <circle cx="80" cy="140" r="14" fill="#f4eeda"/>
    <circle cx="80" cy="140" r="6" fill="#4a4132"/>
    <path d="M160 130 C 230 90, 220 10, 150 -8" fill="none" stroke="#6b5d43" stroke-width="12" stroke-linecap="round"/>
    <rect x="120" y="-26" width="40" height="18" rx="8" fill="#5c5138" transform="rotate(-18 140 -17)"/>
    <circle cx="26" cy="206" r="12" fill="#5c5138"/><circle cx="134" cy="206" r="12" fill="#5c5138"/>
  </g>

  <!-- engraved plaque -->
  <rect x="320" y="548" width="160" height="30" rx="4" fill="#f4eeda" stroke="#8a7c5c" stroke-width="2"/>
  <text x="400" y="568" text-anchor="middle" font-family="monospace" font-size="13" fill="#4a4132">"THE CANISTER"</text>

  <rect width="800" height="600" fill="url(#vpvig)"/>
  <rect width="800" height="600" filter="url(#vpgrain)"/>
</svg>
