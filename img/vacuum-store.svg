<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8d5"/>
      <stop offset="1" stop-color="#ddd2b8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbbfa0"/>
      <stop offset="1" stop-color="#b3a685"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f6"/><stop offset=".45" stop-color="#b9bec4"/>
      <stop offset=".55" stop-color="#8f959c"/><stop offset="1" stop-color="#d7dadd"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a2430"/><stop offset=".5" stop-color="#8e2c39"/><stop offset="1" stop-color="#5e1a24"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8dd" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff8dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a4132" stop-opacity=".35"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".11" intercept="0"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- room -->
  <rect width="800" height="430" fill="url(#wall)"/>
  <rect y="430" width="800" height="170" fill="url(#floor)"/>
  <g stroke="#a3966f" stroke-width="2" opacity=".55">
    <line x1="0" y1="470" x2="800" y2="470"/>
    <line x1="0" y1="515" x2="800" y2="515"/>
    <line x1="0" y1="562" x2="800" y2="562"/>
    <line x1="80" y1="430" x2="30" y2="600"/>
    <line x1="240" y1="430" x2="210" y2="600"/>
    <line x1="400" y1="430" x2="400" y2="600"/>
    <line x1="560" y1="430" x2="590" y2="600"/>
    <line x1="720" y1="430" x2="770" y2="600"/>
  </g>

  <!-- banner: chrome plate, maroon lettering -->
  <rect x="120" y="34" width="560" height="66" rx="6" fill="#5e1a24"/>
  <rect x="126" y="40" width="548" height="54" rx="4" fill="url(#chrome)"/>
  <text x="400" y="66" text-anchor="middle" font-family="monospace" font-size="24" fill="#5e1a24" letter-spacing="3">SOUTHGATE VACUUM SHOWROOM</text>
  <text x="400" y="86" text-anchor="middle" font-family="monospace" font-size="12" fill="#4a4e53" letter-spacing="2">THE CLASSIC MODEL L · POLISHED ALUMINUM · SINCE 1979</text>

  <!-- ceiling lamp + glow + one moth (hi Doreen) -->
  <line x1="620" y1="0" x2="620" y2="120" stroke="#8a7c5c" stroke-width="4"/>
  <path d="M590 120 L650 120 L636 148 L604 148 Z" fill="#c9b98a"/>
  <circle cx="620" cy="160" r="60" fill="url(#lamp)"/>
  <g transform="translate(646,132) rotate(18)">
    <ellipse cx="0" cy="0" rx="7" ry="3.4" fill="#6b5d43"/>
    <ellipse cx="-5" cy="-3" rx="5" ry="3" fill="#857452" transform="rotate(-28)"/>
    <ellipse cx="5" cy="-3" rx="5" ry="3" fill="#857452" transform="rotate(28)"/>
  </g>

  <!-- shelf line -->
  <rect x="60" y="410" width="680" height="14" rx="3" fill="#8a7c5c"/>

  <!-- upright 1: chrome hood, maroon bag, headlight -->
  <g transform="translate(110,268)">
    <rect x="44" y="0" width="6" height="108" rx="3" fill="url(#chrome)" transform="rotate(8 47 54)"/>
    <rect x="48" y="-6" width="14" height="8" rx="4" fill="#2b2b2e" transform="rotate(8 55 -2)"/>
    <path d="M18 18 c0 -6 20 -6 20 0 l5 74 c1 9 -30 9 -30 0 Z" fill="url(#bag)" stroke="#3c1016" stroke-width="2"/>
    <text x="28" y="62" text-anchor="middle" font-family="cursive" font-style="italic" font-size="14" fill="#e9dfd2">L</text>
    <path d="M4 128 c0 -12 12 -18 28 -18 s28 6 28 18 l0 5 c0 4 -56 4 -56 0 Z" fill="url(#chrome)" stroke="#6d737a" stroke-width="1.6"/>
    <circle cx="32" cy="120" r="8" fill="#fffef5" stroke="#6d737a" stroke-width="2"/>
    <rect x="1" y="131" width="62" height="7" rx="3.5" fill="#4a4e53"/>
  </g>
  <g transform="translate(102,240) rotate(-2)">
    <rect width="64" height="26" rx="3" fill="#f4eeda" stroke="#8a7c5c" stroke-width="2"/>
    <text x="32" y="17" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a2430">$47.19</text>
  </g>

  <!-- upright 2: same family, taller bag -->
  <g transform="translate(240,250)">
    <rect x="50" y="0" width="6" height="122" rx="3" fill="url(#chrome)" transform="rotate(7 53 61)"/>
    <rect x="54" y="-6" width="14" height="8" rx="4" fill="#2b2b2e" transform="rotate(7 61 -2)"/>
    <path d="M20 16 c0 -7 24 -7 24 0 l6 88 c1 10 -36 10 -36 0 Z" fill="url(#bag)" stroke="#3c1016" stroke-width="2"/>
    <text x="33" y="66" text-anchor="middle" font-family="cursive" font-style="italic" font-size="15" fill="#e9dfd2">L</text>
    <path d="M6 146 c0 -13 13 -20 30 -20 s30 7 30 20 l0 5 c0 4 -60 4 -60 0 Z" fill="url(#chrome)" stroke="#6d737a" stroke-width="1.6"/>
    <circle cx="36" cy="137" r="8.5" fill="#fffef5" stroke="#6d737a" stroke-width="2"/>
    <rect x="3" y="149" width="66" height="7" rx="3.5" fill="#4a4e53"/>
  </g>
  <g transform="translate(252,222) rotate(1)">
    <rect width="64" height="26" rx="3" fill="#f4eeda" stroke="#8a7c5c" stroke-width="2"/>
    <text x="32" y="17" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a2430">$19.79</text>
  </g>

  <!-- THE UNIT: model L himself. bigger, roped off, not for sale -->
  <g transform="translate(392,232)">
    <rect x="64" y="0" width="8" height="140" rx="4" fill="url(#chrome)" transform="rotate(9 68 70)"/>
    <rect x="70" y="-8" width="18" height="10" rx="5" fill="#2b2b2e" transform="rotate(9 79 -3)"/>
    <path d="M24 20 c0 -9 30 -9 30 0 l7 100 c1 12 -44 12 -44 0 Z" fill="url(#bag)" stroke="#3c1016" stroke-width="2.5"/>
    <text x="40" y="72" text-anchor="middle" font-family="cursive" font-style="italic" font-size="19" fill="#e9dfd2">L</text>
    <text x="40" y="84" text-anchor="middle" font-family="monospace" font-size="5.5" letter-spacing="1" fill="#d8b8a9">CLASSIC</text>
    <path d="M6 168 c0 -15 15 -23 35 -23 s35 8 35 23 l0 6 c0 5 -70 5 -70 0 Z" fill="url(#chrome)" stroke="#6d737a" stroke-width="2"/>
    <circle cx="41" cy="158" r="10" fill="#fffef5" stroke="#6d737a" stroke-width="2.4"/>
    <circle cx="44" cy="158" r="4" fill="#2e2718"/>
    <rect x="2" y="172" width="78" height="8" rx="4" fill="#4a4e53"/>
  </g>
  <!-- velvet rope, actually maroon, he was thrilled -->
  <g>
    <circle cx="382" cy="428" r="6" fill="#5c5138"/><rect x="379" y="380" width="6" height="48" fill="#5c5138"/>
    <circle cx="548" cy="428" r="6" fill="#5c5138"/><rect x="545" y="380" width="6" height="48" fill="#5c5138"/>
    <path d="M382 384 C 430 412, 500 412, 548 384" fill="none" stroke="#7a2430" stroke-width="6"/>
  </g>
  <g transform="translate(424,396) rotate(-2)">
    <rect width="112" height="24" rx="3" fill="#f4eeda" stroke="#8a7c5c" stroke-width="2"/>
    <text x="56" y="16" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a4132">NOT FOR SALE</text>
  </g>

  <!-- upright 4: the compact -->
  <g transform="translate(596,300)">
    <rect x="38" y="0" width="5" height="90" rx="2.5" fill="url(#chrome)" transform="rotate(8 40 45)"/>
    <rect x="42" y="-5" width="12" height="7" rx="3.5" fill="#2b2b2e" transform="rotate(8 48 -2)"/>
    <path d="M14 14 c0 -5 17 -5 17 0 l4 62 c1 8 -26 8 -26 0 Z" fill="url(#bag)" stroke="#3c1016" stroke-width="2"/>
    <path d="M2 108 c0 -10 10 -15 23 -15 s23 5 23 15 l0 4 c0 3 -46 3 -46 0 Z" fill="url(#chrome)" stroke="#6d737a" stroke-width="1.5"/>
    <circle cx="26" cy="101" r="6.5" fill="#fffef5" stroke="#6d737a" stroke-width="1.8"/>
    <rect x="0" y="110" width="50" height="6" rx="3" fill="#4a4e53"/>
  </g>
  <!-- the one crooked tag, flagged for correction -->
  <g transform="translate(586,268) rotate(9)">
    <rect width="64" height="26" rx="3" fill="#f4eeda" stroke="#8a7c5c" stroke-width="2"/>
    <text x="32" y="17" text-anchor="middle" font-family="monospace" font-size="12" fill="#7a2430">$8.47</text>
  </g>
  <g transform="translate(660,258) rotate(-3)">
    <rect width="118" height="30" rx="3" fill="#fffef5" stroke="#8a2b1d" stroke-width="2"/>
    <text x="59" y="13" text-anchor="middle" font-family="monospace" font-size="9" fill="#8a2b1d">CROOKED TAG</text>
    <text x="59" y="24" text-anchor="middle" font-family="monospace" font-size="9" fill="#8a2b1d">TO BE STRAIGHTENED</text>
  </g>

  <!-- small floor placard -->
  <g transform="translate(96,470)">
    <rect width="200" height="54" rx="4" fill="#f4eeda" stroke="#8a7c5c" stroke-width="2" transform="skewY(-2)"/>
    <text x="100" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a4132" transform="skewY(-2)">NO SKATING</text>
    <text x="100" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#4a4132" transform="skewY(-2)">NO GLITTER · NO TOUCHING</text>
  </g>

  <!-- finish: vignette + grain, matching the scrapbook photos -->
  <rect width="800" height="600" fill="url(#vig)"/>
  <rect width="800" height="600" filter="url(#grain)"/>
</svg>
